<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="920" viewBox="0 0 1640 920" role="img" aria-labelledby="title desc"><title id="title">04 / Warehouse grains and relationships</title><desc id="desc">MODEL IN THE SUPPLIED CODE  •  SQLite tested; Snowflake not executed  •  One-to-many logical relationships</desc><rect width="100%" height="100%" fill="#F5F7FB" /><defs><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167C80" /></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7555BC" /></marker><marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C14D32" /></marker><marker id="arrow-proposed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A66C08" /></marker></defs><text x="60" y="62" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" fill="#10243A" font-weight="bold" text-anchor="start">04 / Warehouse grains and relationships</text><text x="60" y="99" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52657D" font-weight="normal" text-anchor="start">MODEL IN THE SUPPLIED CODE  •  SQLite tested; Snowflake not executed  •  One-to-many logical relationships</text><polyline points="255.0,336 255.0,500" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><text x="325" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#167C80" font-weight="normal" text-anchor="middle">1 → many</text><polyline points="820.0,336 820.0,500" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><text x="890" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#167C80" font-weight="normal" text-anchor="middle">1 → many</text><polyline points="625,263.0 545,263 545,390 372,390 372.0,500" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><polyline points="1385.0,336 1385,445 1080,445 1080,573 1015,573.0" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><polyline points="450,573.0 625,573.0" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><text x="537" y="557" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#167C80" font-weight="normal" text-anchor="middle">order_id</text><polyline points="255.0,646 255,690 1385,690 1385.0,646" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow-data)" stroke-linejoin="round" /><text x="820" y="682" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#167C80" font-weight="normal" text-anchor="middle">order_id • 1 → many attempts</text><rect x="60" y="190" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="60" y="204" width="4" height="118" rx="2" fill="#167C80" /><text x="80" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">DIM_DATE</text><text x="80" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: date_key</text><text x="80" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">One UTC calendar date</text><rect x="625" y="190" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="625" y="204" width="4" height="118" rx="2" fill="#167C80" /><text x="645" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">DIM_CUSTOMER</text><text x="645" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: customer_sk • customer_id repeats</text><text x="645" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">One observed version; one current row</text><rect x="1190" y="190" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="1190" y="204" width="4" height="118" rx="2" fill="#167C80" /><text x="1210" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">DIM_PRODUCT</text><text x="1210" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: product_id</text><text x="1210" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">One product; Type 1 attributes</text><rect x="60" y="500" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="60" y="514" width="4" height="118" rx="2" fill="#167C80" /><text x="80" y="543" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">FACT_ORDERS</text><text x="80" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: order_id • one order</text><text x="80" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">customer_sk + date_key + status</text><rect x="625" y="500" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="625" y="514" width="4" height="118" rx="2" fill="#167C80" /><text x="645" y="543" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">FACT_SALES</text><text x="645" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: order_id + line_id • one line</text><text x="645" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">customer_sk + product_id + revenue</text><rect x="1190" y="500" width="390" height="146" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="1190" y="514" width="4" height="118" rx="2" fill="#167C80" /><text x="1210" y="543" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">FACT_PAYMENTS</text><text x="1210" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Key: payment_id • one attempt</text><text x="1210" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">order_id + amount + status</text><rect x="60" y="745" width="960" height="125" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="60" y="759" width="4" height="97" rx="2" fill="#167C80" /><text x="80" y="788" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">Protect the meaning of each row</text><text x="80" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">No direct sales-to-payments join. Sales date comes through its order.</text><text x="80" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Existing facts keep the customer version assigned at first publication.</text><rect x="1080" y="745" width="500" height="125" rx="12" fill="#FFFFFF" stroke="#D5DFEA" stroke-width="1.5" /><rect x="1080" y="759" width="4" height="97" rx="2" fill="#7555BC" /><text x="1100" y="788" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#10243A" font-weight="bold" text-anchor="start">Publication controls</text><text x="1100" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">BATCH_LEDGER + WATERMARKS</text><text x="1100" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Commit with dimensions and facts</text><text x="60" y="892" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#52657D" font-weight="normal" text-anchor="start">Snowflake standard-table key constraints are not a replacement for deduplication checks and serialized publication.</text></svg>