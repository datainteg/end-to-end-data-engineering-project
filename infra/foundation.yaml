AWSTemplateFormatVersion: '2010-09-09'
Description: Ecommerce demo foundation only; job, network and IAM setup is documented separately.
Resources:
  ProjectBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  RequireTLS:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProjectBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ProjectBucket.Arn
              - !Sub '${ProjectBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  PipelineLock:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pipeline_id
          AttributeType: S
      KeySchema:
        - AttributeName: pipeline_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  Notifications:
    Type: AWS::SNS::Topic
Outputs:
  BucketName:
    Value: !Ref ProjectBucket
  LockTable:
    Value: !Ref PipelineLock
  NotificationTopic:
    Value: !Ref Notifications
